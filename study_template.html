<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리눅스 마스터 클래스 — 자습서</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e1116;
    --bg-elevated: #151920;
    --bg-card: #1a1f28;
    --bg-card-hover: #212734;
    --border: #262d3a;
    --border-soft: #1e2430;
    --text: #e7ebf3;
    --text-dim: #8b93a7;
    --text-faint: #5b6478;
    --accent: #f2941f;
    --accent-soft: #f2941f22;
    --accent-line: #f2941f55;
    --accent2: #4fd1c5;
    --accent2-soft: #4fd1c522;
    --practice: #7c8cff;
    --practice-soft: #7c8cff22;
    --danger: #f2686f;
    --danger-soft: #f2686f1f;
    --ok: #52c98a;
    --ok-soft: #52c98a1f;
    --code-bg: #10141b;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius: 10px;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  }

  :root[data-theme="light"] {
    --bg: #f6f5f1;
    --bg-elevated: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #fbf3e6;
    --border: #e4e0d6;
    --border-soft: #ece8dd;
    --text: #201d17;
    --text-dim: #6b6559;
    --text-faint: #a39c8c;
    --accent: #c96c14;
    --accent-soft: #c96c1418;
    --accent-line: #c96c1450;
    --accent2: #0f8f83;
    --accent2-soft: #0f8f8318;
    --practice: #4b53c9;
    --practice-soft: #4b53c918;
    --danger: #c2373f;
    --danger-soft: #c2373f14;
    --ok: #217a4e;
    --ok-soft: #217a4e14;
    --code-bg: #f3efe6;
    --shadow: 0 20px 50px -25px rgba(60,50,30,0.25);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f5f1;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #fbf3e6;
      --border: #e4e0d6;
      --border-soft: #ece8dd;
      --text: #201d17;
      --text-dim: #6b6559;
      --text-faint: #a39c8c;
      --accent: #c96c14;
      --accent-soft: #c96c1418;
      --accent-line: #c96c1450;
      --accent2: #0f8f83;
      --accent2-soft: #0f8f8318;
      --practice: #4b53c9;
      --practice-soft: #4b53c918;
      --danger: #c2373f;
      --danger-soft: #c2373f14;
      --ok: #217a4e;
      --ok-soft: #217a4e14;
      --code-bg: #f3efe6;
      --shadow: 0 20px 50px -25px rgba(60,50,30,0.25);
    }
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }
  ::selection { background: var(--accent-soft); }

  /* ================= Top bar ================= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
  .brand .prompt { font-family: var(--mono); color: var(--accent); font-size: 16px; }
  .brand h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
  .brand .sub {
    font-size: 12px; color: var(--text-faint); font-family: var(--mono);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px;
  }
  .topbar-spacer { flex: 1; }

  .search-box { position: relative; width: 250px; flex-shrink: 0; }
  .search-box input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px 8px 32px;
    font-size: 14px; font-family: var(--sans); outline: none;
    transition: border-color .15s ease;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-box svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text-faint); pointer-events: none;
  }
  .search-box kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
    pointer-events: none;
  }

  .view-toggle {
    display: flex; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0;
  }
  .view-toggle button {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 13.5px; font-family: var(--sans); font-weight: 600;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button.active { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .view-toggle button.active { color: #1a1206; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .view-toggle button.active { color: #1a1206; }
  }
  .view-toggle button svg { width: 14px; height: 14px; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    text-decoration: none; transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: var(--accent-line); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* 전체 진도 바 — top bar 바로 밑에 얇게 */
  .global-progress {
    position: sticky; top: 59px; z-index: 55;
    height: 3px; background: var(--border-soft);
  }
  .global-progress .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }

  /* ================= Layout ================= */
  .shell {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 0;
    max-width: 1560px;
    margin: 0 auto;
  }

  /* ---------- Sidebar TOC ---------- */
  .sidebar {
    position: sticky;
    top: 62px;
    align-self: start;
    height: calc(100vh - 62px);
    overflow-y: auto;
    border-right: 1px solid var(--border-soft);
    padding: 20px 14px 60px 20px;
    scrollbar-width: thin;
  }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .toc-progress {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 9px; padding: 12px 14px; margin-bottom: 16px;
  }
  .toc-progress .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .toc-progress .pct {
    font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .toc-progress .cnt { font-size: 12.5px; color: var(--text-faint); font-family: var(--mono); }
  .toc-progress .bar {
    height: 6px; background: var(--border-soft); border-radius: 3px;
    margin-top: 8px; overflow: hidden;
  }
  .toc-progress .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }
  .toc-progress .reset {
    margin-top: 9px; width: 100%; font-size: 12px; font-family: var(--sans);
    background: transparent; border: 1px solid var(--border); color: var(--text-faint);
    border-radius: 6px; padding: 5px; cursor: pointer;
  }
  .toc-progress .reset:hover { border-color: var(--danger); color: var(--danger); }

  .toc-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-faint); font-weight: 700; margin: 4px 0 8px 4px;
  }

  .toc-sec { margin-bottom: 4px; }
  .toc-sec-head {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 9px; border-radius: 7px; cursor: pointer;
    user-select: none; transition: background .15s;
  }
  .toc-sec-head:hover { background: var(--bg-card-hover); }
  .toc-sec-head .idx {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 4px; padding: 2px 6px; flex-shrink: 0;
  }
  .toc-sec-head .t {
    font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toc-sec-head .done {
    font-family: var(--mono); font-size: 11px; color: var(--text-faint); flex-shrink: 0;
  }
  .toc-sec-head .chev {
    width: 12px; height: 12px; color: var(--text-faint);
    transition: transform .2s; flex-shrink: 0;
  }
  .toc-sec.open .toc-sec-head .chev { transform: rotate(90deg); }

  .toc-ch-list {
    display: none; flex-direction: column; gap: 1px;
    margin: 2px 0 8px 11px; padding-left: 12px;
    border-left: 1px solid var(--border-soft);
  }
  .toc-sec.open .toc-ch-list { display: flex; }

  .toc-ch {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 9px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-dim);
    transition: background .12s, color .12s;
    border: 1px solid transparent;
  }
  .toc-ch:hover { background: var(--bg-card-hover); color: var(--text); }
  .toc-ch.active {
    background: var(--accent-soft); color: var(--text);
    border-color: var(--accent-line); font-weight: 600;
  }
  .toc-ch .no {
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    width: 16px; flex-shrink: 0; text-align: right;
  }
  .toc-ch .t {
    flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .toc-ch .mark {
    width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
    border: 1.5px solid var(--border); display: flex;
    align-items: center; justify-content: center;
  }
  .toc-ch.checked .mark { background: var(--ok); border-color: var(--ok); }
  .toc-ch.checked .mark svg { width: 9px; height: 9px; color: #fff; display: block; }
  .toc-ch .mark svg { display: none; }
  .toc-ch.checked .t { color: var(--text-faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .toc-ch.practice .no { color: var(--practice); }

  /* ---------- Content ---------- */
  .content { padding: 28px 40px 120px; min-width: 0; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Home / overview ---------- */
  .hero {
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--bg-card); padding: 30px 32px; margin-bottom: 22px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(900px 260px at 88% -30%, var(--accent-soft), transparent 70%);
    pointer-events: none;
  }
  .hero .eyebrow {
    font-family: var(--mono); font-size: 12.5px; color: var(--accent);
    letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px;
  }
  .hero h2 { margin: 0 0 12px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
  .hero p { margin: 0 0 10px; color: var(--text-dim); font-size: 15.5px; max-width: 74ch; }
  .hero p:last-child { margin-bottom: 0; }
  .hero p strong { color: var(--text); font-weight: 700; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 10px; margin: 22px 0;
  }
  .stat-tile {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .stat-tile .n {
    font-family: var(--mono); font-size: 25px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .stat-tile .l {
    font-size: 11.5px; color: var(--text-faint); text-transform: uppercase;
    letter-spacing: .06em; margin-top: 3px;
  }
  .stat-tile.a .n { color: var(--accent); }
  .stat-tile.b .n { color: var(--accent2); }
  .stat-tile.c .n { color: var(--practice); }

  .howto {
    border: 1px solid var(--border); border-left: 3px solid var(--accent2);
    border-radius: 10px; background: var(--bg-elevated);
    padding: 20px 24px; margin-bottom: 24px;
  }
  .howto h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
  .howto ol { margin: 0; padding-left: 20px; color: var(--text-dim); font-size: 14.5px; }
  .howto ol li { margin-bottom: 7px; }
  .howto ol li strong { color: var(--text); }
  .howto ol li:last-child { margin-bottom: 0; }

  .sec-cards { display: grid; gap: 12px; }
  .sec-card {
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg-card); padding: 18px 20px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .sec-card:hover {
    border-color: var(--accent-line); background: var(--bg-card-hover);
    transform: translateY(-1px);
  }
  .sec-card .head { display: flex; align-items: center; gap: 11px; margin-bottom: 8px; }
  .sec-card .idx {
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 5px; padding: 3px 8px;
  }
  .sec-card h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; min-width: 0; }
  .sec-card .meta { font-family: var(--mono); font-size: 12.5px; color: var(--text-faint); }
  .sec-card p {
    margin: 0 0 12px; color: var(--text-dim); font-size: 14.5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sec-card .minibar { height: 4px; background: var(--border-soft); border-radius: 2px; overflow: hidden; }
  .sec-card .minibar > i {
    display: block; height: 100%; background: var(--ok); width: 0%;
    transition: width .3s ease;
  }

  /* ---------- Chapter reader ---------- */
  .crumb {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; color: var(--text-faint); margin-bottom: 14px;
  }
  .crumb a { color: var(--text-dim); text-decoration: none; cursor: pointer; }
  .crumb a:hover { color: var(--accent); }
  .crumb .sep { color: var(--text-faint); }

  .ch-head {
    border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 26px;
  }
  .ch-head .tags { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge {
    font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    border-radius: 5px; padding: 3px 8px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.practice { background: var(--practice-soft); color: var(--practice); }
  .badge.plain { background: var(--bg-card); color: var(--text-faint); border: 1px solid var(--border); font-weight: 500; }
  .ch-head h2 {
    margin: 0 0 16px; font-size: 29px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1.32;
  }
  .ch-check {
    display: inline-flex; align-items: center; gap: 9px;
    border: 1px solid var(--border); background: var(--bg-card);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    transition: all .15s; font-family: var(--sans);
  }
  .ch-check:hover { border-color: var(--ok); color: var(--text); }
  .ch-check .box {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--border); display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ch-check .box svg { width: 10px; height: 10px; color: #fff; display: none; }
  .ch-check.on { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .ch-check.on .box { background: var(--ok); border-color: var(--ok); }
  .ch-check.on .box svg { display: block; }

  .goals {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; background: var(--bg-elevated);
    padding: 18px 22px; margin-bottom: 30px;
  }
  .goals .lab {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }
  .goals ul { margin: 0; padding-left: 19px; }
  .goals li { color: var(--text-dim); font-size: 14.8px; margin-bottom: 5px; }
  .goals li:last-child { margin-bottom: 0; }

  /* ---- block: prose ---- */
  .blk { margin-bottom: 30px; }
  .blk h3 {
    margin: 0 0 12px; font-size: 20px; font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.4;
    scroll-margin-top: 80px;
  }
  .blk p { margin: 0 0 14px; font-size: 15.6px; color: var(--text); }
  .blk p:last-child { margin-bottom: 0; }
  .blk code, .inline-code {
    font-family: var(--mono); font-size: .89em;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 4px; padding: 1.5px 5px;
    word-break: break-word;
  }
  .blk strong { font-weight: 700; }

  /* ---- block: callouts ---- */
  .callout {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 30px; background: var(--bg-elevated);
    border-left: 3px solid var(--border);
  }
  .callout .ct {
    display: flex; align-items: center; gap: 8px;
    font-size: 14.5px; font-weight: 700; margin-bottom: 8px;
  }
  .callout .ct svg { width: 15px; height: 15px; flex-shrink: 0; }
  .callout p { margin: 0 0 10px; font-size: 15px; color: var(--text-dim); }
  .callout p:last-child { margin-bottom: 0; }
  .callout code { font-family: var(--mono); font-size: .88em; background: var(--bg-card); color: var(--text); border-radius: 4px; padding: 1.5px 5px; }

  .callout.analogy { border-left-color: var(--accent2); background: var(--accent2-soft); }
  .callout.analogy .ct { color: var(--accent2); }
  .callout.tip { border-left-color: var(--accent); background: var(--accent-soft); }
  .callout.tip .ct { color: var(--accent); }
  .callout.pitfall { border-left-color: var(--danger); background: var(--danger-soft); }
  .callout.pitfall .ct { color: var(--danger); }

  /* ---- block: think ---- */
  .think {
    border: 1px dashed var(--accent-line); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 30px; background: var(--bg-elevated);
  }
  .think .q {
    display: flex; gap: 9px; font-size: 15.3px; font-weight: 600; color: var(--text);
  }
  .think .q svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; margin-top: 4px; }
  .think .reveal {
    margin-top: 12px; font-size: 13.5px; font-weight: 600; font-family: var(--sans);
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 7px; padding: 6px 13px; cursor: pointer;
  }
  .think .reveal:hover { border-color: var(--accent); color: var(--accent); }
  .think .ans {
    display: none; margin-top: 13px; padding-top: 13px;
    border-top: 1px solid var(--border-soft);
  }
  .think.open .ans { display: block; }
  .think .ans p { margin: 0 0 10px; font-size: 14.8px; color: var(--text-dim); }
  .think .ans p:last-child { margin-bottom: 0; }

  /* ---- block: table ---- */
  .tbl-wrap { margin-bottom: 30px; }
  .tbl-wrap .cap {
    font-size: 13px; color: var(--text-faint); margin-bottom: 8px;
    font-weight: 600; letter-spacing: .01em;
  }
  .tbl-scroll {
    overflow-x: auto; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg-card);
  }
  table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 14.3px; }
  thead th {
    text-align: left; padding: 11px 15px; font-weight: 700; font-size: 13px;
    color: var(--text-dim); background: var(--bg-elevated);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td {
    padding: 11px 15px; border-bottom: 1px solid var(--border-soft);
    color: var(--text); vertical-align: top;
  }

<script>
/*__DATA__*/

/* ===================== 상태 ===================== */
const LS_PROGRESS = 'linuxStudy.progress.v1';
const LS_THEME    = 'linuxStudy.theme.v1';
const LS_QUIZ     = 'linuxStudy.quiz.v1';

const FLAT = [];
DB.sections.forEach(sec => {
  sec.chapters.forEach(ch => {
    FLAT.push({ sectionNo: sec.section_no, sectionTitle: sec.section_title, ch });
  });
});

const el = id => document.getElementById(id);
const key = (s, c) => s + '-' + c;

function loadSet(k) {
  try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); }
  catch (e) { return new Set(); }
}
function saveSet(k, set) {
  try { localStorage.setItem(k, JSON.stringify([...set])); } catch (e) {}
}
function loadMap(k) {
  try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; }
  catch (e) { return {}; }
}
function saveMap(k, obj) {
  try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e) {}
}

let done      = loadSet(LS_PROGRESS);   // 학습 완료 챕터 "s-c"
let quizState = loadMap(LS_QUIZ);       // { quizId: pickedIndex }

/* ===================== 유틸 ===================== */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 인라인 마크다운: `코드`, **강조**
function inline(s) {
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (m, p) => '<code>' + p + '</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, (m, p) => '<strong>' + p + '</strong>');
  return t;
}

function paras(body) {
  return String(body || '')
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => '<p>' + inline(p).replace(/\n/g, '<br>') + '</p>')
    .join('');
}

let toastTimer = null;
function toast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
  if (btn) {
    const old = btn.innerHTML;
    btn.classList.add('done');
    btn.innerHTML = ICON.check;
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = old; }, 1200);
  }
  toast('복사했습니다');
}

function findChapter(s, c) {
  const sec = DB.sections.find(x => x.section_no === +s);
  if (!sec) return null;
  const ch = sec.chapters.find(x => x.no === +c);
  if (!ch) return null;
  return { sec, ch };
}

function flatIndex(s, c) {
  return FLAT.findIndex(f => f.sectionNo === +s && f.ch.no === +c);
}

/* ===================== 진도 ===================== */
function renderProgress() {
  const total = FLAT.length;
  const n = [...done].filter(k => {
    const [s, c] = k.split('-');
    return !!findChapter(s, c);
  }).length;
  const pct = total ? Math.round((n / total) * 100) : 0;
  el('pgPct').textContent = pct + '%';
  el('pgCnt').textContent = n + ' / ' + total;
  el('pgBar').style.width = pct + '%';
  el('gpFill').style.width = pct + '%';
}

function toggleDone(s, c, force) {
  const k = key(s, c);
  const next = force === undefined ? !done.has(k) : force;
  if (next) done.add(k); else done.delete(k);
  saveSet(LS_PROGRESS, done);
  renderProgress();
  renderToc();
  if (currentView === 'chapter' && current && current.s === +s && current.c === +c) {
    syncCheckBtn();
  }
  if (currentView === 'home') renderHome();
}

function syncCheckBtn() {
  const btn = document.querySelector('#view-chapter .ch-check');
  if (!btn || !current) return;
  const on = done.has(key(current.s, current.c));
  btn.classList.toggle('on', on);
  btn.querySelector('.lbl').textContent = on ? '학습 완료' : '학습 완료로 표시';
}

/* ===================== 사이드바 목차 ===================== */
function renderToc() {
  let html = '';
  DB.sections.forEach(sec => {
    const chs = sec.chapters;
    const n = chs.filter(c => done.has(key(sec.section_no, c.no))).length;
    const isOpen = openSecs.has(sec.section_no);
    html += '<div class="toc-sec ' + (isOpen ? 'open' : '') + '" data-sec="' + sec.section_no + '">' +
      '<div class="toc-sec-head">' +
        '<span class="idx">S' + sec.section_no + '</span>' +
        '<span class="t">' + esc(sec.section_title) + '</span>' +
        '<span class="done">' + n + '/' + chs.length + '</span>' +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>' +
      '</div>' +
      '<div class="toc-ch-list">' +
        chs.map(ch => {
          const k = key(sec.section_no, ch.no);
          const cls = ['toc-ch'];
          if (done.has(k)) cls.push('checked');
          if (ch.is_practice) cls.push('practice');
          if (current && current.s === sec.section_no && current.c === ch.no) cls.push('active');
          return '<div class="' + cls.join(' ') + '" data-s="' + sec.section_no + '" data-c="' + ch.no + '">' +
            '<span class="no">' + ch.no + '</span>' +
            '<span class="t">' + esc(ch.title) + '</span>' +
            '<span class="mark" title="학습 완료 표시">' + ICON.check + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  });
  el('toc').innerHTML = html;

  el('toc').querySelectorAll('.toc-sec-head').forEach(h => {
    h.addEventListener('click', () => {
      const no = +h.parentElement.dataset.sec;
      if (openSecs.has(no)) openSecs.delete(no); else openSecs.add(no);
      renderToc();
    });
  });
  el('toc').querySelectorAll('.toc-ch').forEach(node => {
    node.addEventListener('click', ev => {
      const s = +node.dataset.s, c = +node.dataset.c;
      if (ev.target.closest('.mark')) {
        ev.stopPropagation();
        toggleDone(s, c);
        return;
      }
      openChapter(s, c);
      closeSidebar();
    });
  });
}

/* ===================== 블록 렌더러 ===================== */
function renderBlock(b) {
  switch (b.type) {
    case 'prose':
      return '<section class="blk">' +
        (b.heading ? '<h3 id="' + slug(b.heading) + '">' + inline(b.heading) + '</h3>' : '') +
        paras(b.body) +
      '</section>';

    case 'analogy':
      return '<div class="callout analogy">' +
        '<div class="ct">' + ICON.link + '<span>비유로 이해하기' + (b.title ? ' — ' + esc(b.title) : '') + '</span></div>' +
        paras(b.body) +
      '</div>';

    case 'tip':
      return '<div class="callout tip">' +
        '<div class="ct">' + ICON.bulb + '<span>' + esc(b.title || '실무 팁') + '</span></div>' +
        paras(b.body) +
      '</div>';

    case 'pitfall':
      return '<div class="callout pitfall">' +
        '<div class="ct">' + ICON.warn + '<span>흔한 실수 — ' + esc(b.title || '') + '</span></div>' +
        paras(b.body) +
      '</div>';

    case 'think':
      return '<div class="think">' +
        '<div class="q">' + ICON.q + '<span>' + inline(b.body) + '</span></div>' +
        (b.answer
          ? '<button class="reveal">답 확인하기</button><div class="ans">' + paras(b.answer) + '</div>'
          : '') +
      '</div>';

    case 'table': {
      const heads = (b.headers || []).map(h => '<th>' + inline(h) + '</th>').join('');
      const rows = (b.rows || []).map(r =>
        '<tr>' + (r || []).map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>'
      ).join('');
      return '<div class="tbl-wrap">' +
        (b.title ? '<div class="cap">' + esc(b.title) + '</div>' : '') +
        '<div class="tbl-scroll"><table><thead><tr>' + heads + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>';
    }

    case 'code': {
      const lines = (b.lines || []).map(ln => {
        const cmd = String(ln.cmd == null ? '' : ln.cmd);
        return '<div class="cline">' +
          '<div class="cmd-row">' +
            '<span class="sigil">$</span>' +
            '<span class="cmd">' + esc(cmd) + '</span>' +
            '<button class="copy" data-copy="' + encodeURIComponent(cmd) + '" title="복사">' + ICON.copy + '</button>' +
          '</div>' +
          (ln.out ? '<div class="out">' + esc(ln.out) + '</div>' : '') +
          (ln.note ? '<div class="note">' + inline(ln.note) + '</div>' : '') +
        '</div>';
      }).join('');
      const all = (b.lines || []).map(l => l.cmd).filter(Boolean).join('\n');
      return '<div class="codeblk">' +
        (b.title ? '<div class="cap">' + ICON.term + '<span>' + esc(b.title) + '</span></div>' : '') +
        '<div class="term">' +
          '<div class="term-bar">' +
            '<span class="dots"><i></i><i></i><i></i></span>' +
            '<span class="lang">' + esc(b.lang || 'bash') + '</span>' +
            '<button class="copy-all" data-copy="' + encodeURIComponent(all) + '">전체 복사</button>' +
          '</div>' +
          '<div class="term-body">' + lines + '</div>' +
        '</div>' +
      '</div>';
    }

    case 'lab': {
      const steps = (b.steps || []).map((st, i) =>
        '<div class="step">' +
          '<div class="n">' + (i + 1) + '</div>' +
          '<div class="sbody">' +
            '<div class="desc">' + inline(st.desc || '') + '</div>' +
            (st.cmd
              ? '<div class="scmd"><span class="sigil">$</span><span class="c">' + esc(st.cmd) + '</span>' +
                '<button class="copy" data-copy="' + encodeURIComponent(st.cmd) + '" title="복사">' + ICON.copy + '</button></div>'
              : '') +
            (st.expect
              ? '<div class="expect">' + ICON.check + '<span>' + inline(st.expect) + '</span></div>'
              : '') +
          '</div>' +
        '</div>'
      ).join('');
      return '<div class="lab">' +
        '<div class="lt">' + ICON.flask + '<span>' + esc(b.title || '실습') + '</span></div>' +
        steps +
        (b.wrapup ? '<div class="wrapup">' + inline(b.wrapup) + '</div>' : '') +
      '</div>';
    }

    default:
      return '';
  }
}

function slug(s) {
  return 'h-' + String(s).replace(/[^\w가-힣]+/g, '-').toLowerCase();
}

/* ===================== 퀴즈 카드 ===================== */
function quizCardHtml(q, opts) {
  opts = opts || {};
  const picked = quizState[q.id];
  const answered = picked !== undefined;
  const choices = q.choices.map((ch, i) => {
    let cls = 'choice';
    if (answered) {
      if (i === q.correct_index) cls += ' correct';
      else if (i === picked) cls += ' wrong';
    }
    return '<button class="' + cls + '" data-qid="' + q.id + '" data-i="' + i + '"' +
      (answered ? ' disabled' : '') + '>' +
      '<span class="k">' + 'ABCD'[i] + '</span><span>' + inline(ch) + '</span></button>';
  }).join('');

  const verdict = answered
    ? (picked === q.correct_index ? '<b>정답입니다.</b> ' : '<b>아쉽네요.</b> ')
    : '';

  return '<div class="quiz-card" data-qid="' + q.id + '">' +
    (opts.src
      ? '<span class="src" data-s="' + opts.src.s + '" data-c="' + opts.src.c + '">S' +
        opts.src.s + ' · 챕터 ' + opts.src.c + '. ' + esc(opts.src.title) + ' →</span>'
      : '<div class="qt">' + ICON.q + '<span>이해도 점검</span></div>') +
    '<div class="quiz-q">' + inline(q.question) + '</div>' +
    '<div class="choices">' + choices + '</div>' +
    '<div class="explain' + (answered ? ' show' : '') + '">' + verdict + inline(q.explanation) + '</div>' +
  '</div>';
}

function bindQuiz(root) {
  root.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      if (quizState[qid] !== undefined) return;
      quizState[qid] = +btn.dataset.i;
      saveMap(LS_QUIZ, quizState);
      const card = btn.closest('.quiz-card');
      const q = allQuizzes().find(x => x.q.id === qid);
      if (!q) return;
      card.querySelectorAll('.choice').forEach((b, i) => {
        b.disabled = true;
        if (i === q.q.correct_index) b.classList.add('correct');
        else if (i === quizState[qid]) b.classList.add('wrong');
      });
      const ex = card.querySelector('.explain');
      ex.innerHTML = (quizState[qid] === q.q.correct_index
        ? '<b>정답입니다.</b> ' : '<b>아쉽네요.</b> ') + inline(q.q.explanation);
      ex.classList.add('show');
      if (currentView === 'quiz') renderQuizScore();
    });
  });
}

function allQuizzes() {
  const out = [];
  Object.keys(DB.quizzes).forEach(k => {
    const [s, c] = k.split('-').map(Number);
    const found = findChapter(s, c);
    DB.quizzes[k].forEach(q => {
      out.push({ q, s, c, title: found ? found.ch.title : '' });
    });
  });
  out.sort((a, b) => a.s - b.s || a.c - b.c || a.q.id.localeCompare(b.q.id));
  return out;
}

/* ===================== 챕터 본문 ===================== */
function openChapter(s, c) {
  const found = findChapter(s, c);
  if (!found) return;
  const { sec, ch } = found;
  current = { s: +s, c: +c };
  openSecs.add(+s);

  const idx = flatIndex(s, c);
  const prev = idx > 0 ? FLAT[idx - 1] : null;
  const next = idx >= 0 && idx < FLAT.length - 1 ? FLAT[idx + 1] : null;

  const blocks = (ch.blocks || []).map(renderBlock).join('');
  const goals = (ch.goals || []).length
    ? '<div class="goals"><div class="lab">학습 목표</div><ul>' +
      ch.goals.map(g => '<li>' + inline(g) + '</li>').join('') + '</ul></div>'
    : '';
  const summary = (ch.summary || []).length
    ? '<div class="summary">' +
        '<div class="st">' + ICON.list + '<span>챕터 핵심 정리</span></div>' +
        '<ul>' + ch.summary.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>' +
        ((ch.commands || []).length
          ? '<div class="cmd-recap"><div class="crt">이 챕터의 명령어</div><div class="cmd-chips">' +
            ch.commands.map(cm => '<span class="cmd-chip"><b>' + esc(cm.cmd) + '</b>' +
              (cm.desc ? ' — ' + esc(cm.desc) : '') + '</span>').join('') +
            '</div></div>'
          : '') +
      '</div>'
    : '';

  const qs = DB.quizzes[key(s, c)] || [];
  const quizHtml = qs.map(q => quizCardHtml(q)).join('');

  el('view-chapter').innerHTML =
    '<div class="crumb">' +
      '<a data-home="1">자습서 홈</a><span class="sep">/</span>' +
      '<a data-sec="' + sec.section_no + '">섹션 ' + sec.section_no + '. ' + esc(sec.section_title) + '</a>' +
      '<span class="sep">/</span><span>챕터 ' + ch.no + '</span>' +
    '</div>' +
    '<div class="ch-head">' +
      '<div class="tags">' +
        '<span class="badge">S' + sec.section_no + ' · 챕터 ' + ch.no + '</span>' +
        (ch.is_practice ? '<span class="badge practice">실습 챕터</span>' : '') +
        ((ch.keywords || []).length
          ? '<span class="badge plain">' + esc(ch.keywords.slice(0, 4).join(' · ')) + '</span>'
          : '') +
      '</div>' +
      '<h2>' + esc(ch.title) + '</h2>' +
      '<button class="ch-check"><span class="box">' + ICON.check + '</span><span class="lbl">학습 완료로 표시</span></button>' +
    '</div>' +
    goals +
    blocks +
    summary +
    quizHtml +
    '<div class="chnav">' +
      (prev
        ? '<button class="navbtn prv" data-s="' + prev.sectionNo + '" data-c="' + prev.ch.no + '">' +
          '<span class="l">← 이전 챕터</span><span class="t">' + esc(prev.ch.title) + '</span></button>'
        : '<button class="navbtn prv" disabled><span class="l">← 이전 챕터</span><span class="t">처음 챕터입니다</span></button>') +
      (next
        ? '<button class="navbtn nxt" data-s="' + next.sectionNo + '" data-c="' + next.ch.no + '">' +
          '<span class="l">다음 챕터 →</span><span class="t">' + esc(next.ch.title) + '</span></button>'
        : '<button class="navbtn nxt" disabled><span class="l">다음 챕터 →</span><span class="t">마지막 챕터입니다</span></button>') +
    '</div>';

  const root = el('view-chapter');

  root.querySelector('.ch-check').addEventListener('click', () => {
    toggleDone(current.s, current.c);
    if (done.has(key(current.s, current.c))) toast('학습 완료로 표시했습니다');
  });
  root.querySelectorAll('.think .reveal').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = btn.closest('.think');
      box.classList.toggle('open');
      btn.textContent = box.classList.contains('open') ? '답 접기' : '답 확인하기';
    });
  });
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyText(decodeURIComponent(btn.dataset.copy), btn));
  });
  root.querySelectorAll('.navbtn:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => openChapter(+btn.dataset.s, +btn.dataset.c));
  });
  root.querySelector('[data-home]').addEventListener('click', () => switchView('home'));
  const secLink = root.querySelector('[data-sec]');
  if (secLink) {
    secLink.addEventListener('click', () => {
      openSecs.add(+secLink.dataset.sec);
      switchView('home');
      renderToc();
    });
  }
  bindQuiz(root);

  syncCheckBtn();
  switchView('chapter');
  renderToc();
  window.scrollTo({ top: 0, behavior: 'auto' });
  const url = '#s' + s + 'c' + c;
  if (location.hash !== url) history.replaceState(null, '', url);
}

/* ===================== 치트시트 ===================== */
let csFilter = '';

function renderCheat() {
  const q = csFilter.trim().toLowerCase();
  const rows = DB.cheatsheet.filter(r =>
    !q || r.cmd.toLowerCase().includes(q) || (r.desc || '').toLowerCase().includes(q) ||
    r.examples.some(e => e.toLowerCase().includes(q))
  );

  const cards = rows.map(r =>
    '<div class="cs-card">' +
      '<div class="name">' + esc(r.cmd) + '</div>' +
      (r.desc ? '<div class="desc">' + esc(r.desc) + '</div>' : '') +
      r.examples.map(e =>
        '<div class="cs-ex"><span class="sigil">$</span><span class="e">' + esc(e) + '</span>' +
        '<button class="copy" data-copy="' + encodeURIComponent(e) + '" title="복사">' + ICON.copy + '</button></div>'
      ).join('') +
      '<div class="refs">' + r.refs.map(rf =>
        '<span class="cs-ref" data-s="' + rf.s + '" data-c="' + rf.c + '" title="' + esc(rf.t) + '">S' +
        rf.s + '·' + rf.c + '</span>'
      ).join('') + '</div>' +
    '</div>'
  ).join('');

  el('view-cheat').innerHTML =
    '<div class="page-head">' +
      '<h2>명령어 치트시트</h2>' +
      '<p>강의 전체에 등장한 명령어 ' + DB.cheatsheet.length + '개를 한 페이지에 모았습니다. ' +
      '각 카드 아래의 <code class="inline-code">S섹션·챕터</code> 배지를 누르면 그 명령어를 배운 본문으로 바로 이동합니다.</p>' +
    '</div>' +
    '<div class="cs-filter">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '<input type="text" id="csInput" placeholder="명령어 걸러보기 (예: chmod, grep)" value="' + esc(csFilter) + '">' +
    '</div>' +
    (rows.length ? '<div class="cs-grid">' + cards + '</div>' : '<div class="empty">조건에 맞는 명령어가 없습니다.</div>');

  const input = el('csInput');
  input.addEventListener('input', () => {
    csFilter = input.value;
    const pos = input.selectionStart;
    renderCheat();
    const again = el('csInput');
    again.focus();
    try { again.setSelectionRange(pos, pos); } catch (e) {}
  });
  el('view-cheat').querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyText(decodeURIComponent(btn.dataset.copy), btn));
  });
  el('view-cheat').querySelectorAll('.cs-ref').forEach(ref => {
    ref.addEventListener('click', () => openChapter(+ref.dataset.s, +ref.dataset.c));
  });
}

/* ===================== 퀴즈 전체 보기 ===================== */
function renderQuizScore() {
  const all = allQuizzes();
  const answered = all.filter(x => quizState[x.q.id] !== undefined);
  const right = answered.filter(x => quizState[x.q.id] === x.q.correct_index).length;
  const scoreEl = el('quizScore');
  if (scoreEl) {
    scoreEl.textContent = right + ' / ' + all.length;
    el('quizSub').textContent = answered.length
      ? answered.length + '문항 풀었고 ' + right + '문항 맞혔습니다'
      : '아직 푼 문항이 없습니다';
  }
}

function renderQuiz() {
  const all = allQuizzes();
  el('view-quiz').innerHTML =
    '<div class="page-head">' +
      '<h2>이해도 점검 퀴즈</h2>' +
      '<p>강의 전체에서 헷갈리기 쉬운 지점을 뽑은 ' + all.length + '문항입니다. ' +
      '각 문항의 출처 배지를 누르면 해당 챕터 본문으로 이동합니다. 푼 기록은 브라우저에 저장됩니다.</p>' +
    '</div>' +
    '<div class="quiz-head">' +
      '<span class="score" id="quizScore">0 / 0</span>' +
      '<span class="sl" id="quizSub"></span>' +
      '<span class="spacer"></span>' +
      '<button id="quizReset">퀴즈 기록 초기화</button>' +
    '</div>' +
    '<div class="quiz-list">' +
      all.map(x => quizCardHtml(x.q, { src: { s: x.s, c: x.c, title: x.title } })).join('') +
    '</div>';

  bindQuiz(el('view-quiz'));
  el('view-quiz').querySelectorAll('.src').forEach(s => {
    s.addEventListener('click', () => openChapter(+s.dataset.s, +s.dataset.c));
  });
  el('quizReset').addEventListener('click', () => {
    if (!confirm('퀴즈 응답 기록을 모두 지웁니다. 계속할까요?')) return;
    quizState = {};
    saveMap(LS_QUIZ, quizState);
    renderQuiz();
  });
  renderQuizScore();
}

/* ===================== 검색 ===================== */
function renderSearch(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) { switchView('home'); return; }

  const hits = DB.searchIndex
    .map(item => {
      const pos = item.text.indexOf(needle);
      const inTitle = item.title.toLowerCase().includes(needle);
      if (pos === -1 && !inTitle) return null;
      let snip = '';
      if (pos !== -1) {
        const from = Math.max(0, pos - 60);
        snip = (from ? '…' : '') + item.text.slice(from, pos + needle.length + 110) + '…';
      }
      return { item, pos, inTitle, snip };
    })
    .filter(Boolean)
    .sort((a, b) => (b.inTitle - a.inTitle) || (a.item.s - b.item.s) || (a.item.c - b.item.c));

  const mark = t => esc(t).replace(
    new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
    m => '<mark>' + m + '</mark>'
  );

  el('view-search').innerHTML =
    '<div class="page-head">' +
      '<h2>"' + esc(q) + '" 검색 결과</h2>' +
      '<p>본문·표·명령어·실습 단계까지 모두 뒤져 ' + hits.length + '개 챕터를 찾았습니다.</p>' +
    '</div>' +
    (hits.length
      ? '<div class="sr-list">' + hits.map(h =>
          '<div class="sr-item" data-s="' + h.item.s + '" data-c="' + h.item.c + '">' +
            '<div class="top">' +
              '<span class="where">S' + h.item.s + ' · 챕터 ' + h.item.c + '</span>' +
              '<h4>' + mark(h.item.title) + '</h4>' +
            '</div>' +
            (h.snip ? '<div class="snip">' + mark(h.snip) + '</div>' : '') +
          '</div>'
        ).join('') + '</div>'
      : '<div class="empty">검색 결과가 없습니다. 다른 키워드로 찾아보세요.</div>');

  el('view-search').querySelectorAll('.sr-item').forEach(it => {
    it.addEventListener('click', () => openChapter(+it.dataset.s, +it.dataset.c));
  });
  switchView('search', true);
}

/* ===================== 뷰 전환 ===================== */
function switchView(name, keepSearch) {
  currentView = name;
  ['home', 'chapter', 'cheat', 'quiz', 'search'].forEach(v => {
    el('view-' + v).classList.toggle('active', v === name);
  });
  document.querySelectorAll('.view-toggle button').forEach(b => {
    const isOn = b.dataset.view === name;
    b.classList.toggle('active', isOn);
    b.setAttribute('aria-selected', isOn ? 'true' : 'false');
  });
  if (!keepSearch && name !== 'search') {
    const si = el('searchInput');
    if (si.value) si.value = '';
  }
  if (name === 'home') renderHome();
  if (name === 'cheat') renderCheat();
  if (name === 'quiz') renderQuiz();
  if (name !== 'chapter') {
    current = null;
    renderToc();
    if (location.hash) history.replaceState(null, '', location.pathname);
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function closeSidebar() {
  el('sidebar').classList.remove('open');
  el('scrim').classList.remove('show');
}

/* ===================== 테마 ===================== */
function applyTheme(t) {
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

/* ===================== 초기화 ===================== */
(function init() {
  const saved = localStorage.getItem(LS_THEME);
  if (saved) applyTheme(saved);

  el('themeBtn').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(LS_THEME, next); } catch (e) {}
  });

  document.querySelectorAll('.view-toggle button').forEach(b => {
    b.addEventListener('click', () => switchView(b.dataset.view));
  });

  el('menuBtn').addEventListener('click', () => {
    el('sidebar').classList.add('open');
    el('scrim').classList.add('show');
  });
  el('scrim').addEventListener('click', closeSidebar);

  el('pgReset').addEventListener('click', () => {
    if (!confirm('학습 완료 표시를 모두 지웁니다. 계속할까요?')) return;
    done = new Set();
    saveSet(LS_PROGRESS, done);
    renderProgress();
    renderToc();
    if (currentView === 'chapter') syncCheckBtn();
    if (currentView === 'home') renderHome();
    toast('진도를 초기화했습니다');
  });

  let searchTimer = null;
  el('searchInput').addEventListener('input', e => {
    const v = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (v.trim()) renderSearch(v);
      else if (currentView === 'search') switchView('home');
    }, 180);
  });

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) {
      e.preventDefault();
      el('searchInput').focus();
      return;
    }
    if (e.key === 'Escape') {
      if (document.activeElement === el('searchInput')) {
        el('searchInput').value = '';
        el('searchInput').blur();
        if (currentView === 'search') switchView('home');
      }
      closeSidebar();
      return;
    }
    if (typing || !current) return;
    const idx = flatIndex(current.s, current.c);
    if (e.key === 'ArrowLeft' && idx > 0) {
      openChapter(FLAT[idx - 1].sectionNo, FLAT[idx - 1].ch.no);
    } else if (e.key === 'ArrowRight' && idx < FLAT.length - 1) {
      openChapter(FLAT[idx + 1].sectionNo, FLAT[idx + 1].ch.no);
    }
  });

  renderProgress();
  renderToc();

  const m = /^#s(\d+)c(\d+)$/.exec(location.hash || '');
  if (m && findChapter(m[1], m[2])) openChapter(+m[1], +m[2]);
  else renderHome();
})();
</script>
