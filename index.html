<meta charset="utf-8">
<title>리눅스 마스터 클래스 — 커리큘럼 로드맵</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono'), local('Menlo'), local('Consolas');
  }

  :root {
    --bg: #0e1116;
    --bg-elevated: #151920;
    --bg-card: #1a1f28;
    --bg-card-hover: #212734;
    --border: #262d3a;
    --border-soft: #1e2430;
    --text: #e7ebf3;
    --text-dim: #8b93a7;
    --text-faint: #5b6478;
    --accent: #f2941f;
    --accent-soft: #f2941f22;
    --accent-line: #f2941f55;
    --accent2: #4fd1c5;
    --accent2-soft: #4fd1c522;
    --practice: #7c8cff;
    --practice-soft: #7c8cff22;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius: 10px;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  }

  :root[data-theme="light"] {
    --bg: #f6f5f1;
    --bg-elevated: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #fbf3e6;
    --border: #e4e0d6;
    --border-soft: #ece8dd;
    --text: #201d17;
    --text-dim: #6b6559;
    --text-faint: #a39c8c;
    --accent: #c96c14;
    --accent-soft: #c96c1418;
    --accent-line: #c96c1450;
    --accent2: #0f8f83;
    --accent2-soft: #0f8f8318;
    --practice: #4b53c9;
    --practice-soft: #4b53c918;
    --shadow: 0 20px 50px -25px rgba(60,50,30,0.25);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f5f1;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #fbf3e6;
      --border: #e4e0d6;
      --border-soft: #ece8dd;
      --text: #201d17;
      --text-dim: #6b6559;
      --text-faint: #a39c8c;
      --accent: #c96c14;
      --accent-soft: #c96c1418;
      --accent-line: #c96c1450;
      --accent2: #0f8f83;
      --accent2-soft: #0f8f8318;
      --practice: #4b53c9;
      --practice-soft: #4b53c918;
      --shadow: 0 20px 50px -25px rgba(60,50,30,0.25);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 28px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  .brand .prompt {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 17px;
  }
  .brand h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .sub {
    font-size: 13.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  .topbar-spacer { flex: 1; }

  .search-box {
    position: relative;
    width: 260px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px 9px 32px;
    font-size: 14.5px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .15s ease;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-box svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .view-toggle {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-family: var(--sans);
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .view-toggle button.active {
    background: var(--accent);
    color: #1a1206;
  }
  :root[data-theme="light"] .view-toggle button.active,
  @media (prefers-color-scheme: light) { }
  .view-toggle button svg { width: 14px; height: 14px; }

  .theme-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-btn svg { width: 17px; height: 17px; }

  /* 자습서(study.html)로 이동 — 뷰 전환 탭이 아니라 별도 문서로 나가는 링크 */
  .study-link {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    height: 34px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .study-link:hover { background: var(--accent); color: #1a1206; }
  :root[data-theme="light"] .study-link:hover { color: #fff; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .study-link:hover { color: #fff; }
  }
  .study-link svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ---------- Stats strip ---------- */
  .stats {
    display: flex;
    gap: 0;
    padding: 0 28px;
    border-bottom: 1px solid var(--border-soft);
    overflow-x: auto;
  }
  .stat {
    padding: 14px 20px 14px 0;
    margin-right: 20px;
    border-right: 1px solid var(--border-soft);
    white-space: nowrap;
  }
  .stat:last-child { border-right: none; }
  .stat .num {
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .num.accent { color: var(--accent); }
  .stat .label {
    font-size: 12.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: 2px;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
    padding: 14px 0;
    font-size: 13.5px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ---------- Main ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 28px 80px;
  }

  .section-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .chip {
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent-line); color: var(--text); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1206;
    font-weight: 700;
  }

  /* ================= TREE VIEW ================= */
  .tree-view { display: none; }
  .tree-view.active { display: block; }

  .root-node {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .root-node .glyph {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
  }
  .root-node .label {
    font-family: var(--mono);
    font-size: 15.5px;
    color: var(--text-dim);
  }
  .root-node .label b { color: var(--text); font-weight: 700; }

  .trunk {
    border-left: 2px solid var(--border);
    margin-left: 13px;
    padding-left: 24px;
    padding-top: 8px;
  }

  .section-branch {
    position: relative;
    margin-bottom: 4px;
  }
  .section-branch::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 22px;
    width: 24px;
    height: 2px;
    background: var(--border);
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
    user-select: none;
  }
  .section-head:hover { background: var(--bg-card-hover); border-color: var(--accent-line); }
  .section-head .idx {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 3px 8px;
    flex-shrink: 0;
  }
  .section-head h3 {
    margin: 0;
    font-size: 16.5px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .section-head .meta {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-faint);
    flex-shrink: 0;
  }
  .section-head .chev {
    width: 14px;
    height: 14px;
    color: var(--text-faint);
    transition: transform .2s ease;
    flex-shrink: 0;
  }
  .section-branch.open .section-head .chev { transform: rotate(90deg); }

  .chapter-list {
    display: none;
    padding: 14px 0 6px 24px;
    margin-left: 13px;
    border-left: 2px solid var(--border-soft);
  }
  .section-branch.open .chapter-list { display: flex; flex-direction: column; gap: 8px; }

  .chapter-node {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .chapter-node::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 50%;
    width: 24px;
    height: 2px;
    background: var(--border-soft);
  }
  .chapter-node:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-line);
    transform: translateX(2px);
  }
  .chapter-node.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .chapter-node .cno {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    width: 20px;
    flex-shrink: 0;
  }
  .chapter-node .ctitle {
    font-size: 14.5px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chapter-node .badge-practice {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--practice);
    background: var(--practice-soft);
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    letter-spacing: .02em;
  }

  mark {
    background: var(--accent);
    color: #1a1206;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ================= LIST VIEW ================= */
  .list-view { display: none; }
  .list-view.active { display: block; }

  .list-section {
    margin-bottom: 22px;
  }
  .list-section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .list-section-head .idx {
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
  }
  .list-section-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
  .list-section-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-faint);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px;
  }

  .chapter-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .chapter-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-line);
    transform: translateY(-2px);
  }
  .chapter-card.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .chapter-card .top-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .chapter-card .cno {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
  }
  .chapter-card .badge-practice {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--practice);
    background: var(--practice-soft);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: auto;
  }
  .chapter-card .ctitle {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }

  /* ================= DETAIL PANEL ================= */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 50;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(420px, 92vw);
    background: var(--bg-elevated);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: translateX(100%);
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
    z-index: 51;
    display: flex;
    flex-direction: column;
  }
  .detail-panel.open { transform: translateX(0); }

  .detail-header {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .detail-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .detail-header { position: relative; }
  .detail-eyebrow {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-eyebrow .practice-tag {
    color: var(--practice);
    background: var(--practice-soft);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
  }
  .detail-title {
    font-size: 23px;
    font-weight: 800;
    line-height: 1.3;
    text-wrap: balance;
    padding-right: 30px;
  }

  .detail-body {
    padding: 20px 24px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .detail-section-label {
    font-family: var(--mono);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-faint);
    margin: 0 0 12px;
  }
  .topic-item {
    display: flex;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 15px;
    line-height: 1.55;
  }
  .topic-item:last-child { border-bottom: none; }
  .topic-item .tick {
    color: var(--accent2);
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 14.5px;
    margin-top: 1px;
  }

  .detail-nav {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
    text-align: left;
    font-family: var(--sans);
  }
  .nav-btn:hover { border-color: var(--accent-line); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn .nav-label {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--mono);
    text-transform: uppercase;
  }
  .nav-btn .nav-title {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-btn.next { text-align: right; }
  .nav-btn.next .nav-label { text-align: right; }

  /* ---------- quiz mode ---------- */
  .quiz-view { display: none; }
  .quiz-view.active { display: block; }

  .quiz-intro {
    max-width: 640px;
    margin: 40px auto;
    text-align: center;
  }
  .quiz-intro h2 {
    font-size: 25px;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .quiz-intro p {
    color: var(--text-dim);
    font-size: 15.5px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .quiz-scope {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .quiz-scope button {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .quiz-scope button:hover { border-color: var(--accent-line); color: var(--text); }
  .quiz-scope button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1206;
  }
  .quiz-start-btn {
    border: none;
    background: var(--accent);
    color: #1a1206;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 700;
    padding: 13px 30px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, opacity .15s ease;
  }
  .quiz-start-btn:hover { transform: translateY(-1px); }
  .quiz-start-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .quiz-count-hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  .quiz-best {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border-soft);
    font-size: 13.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  .quiz-runner { max-width: 680px; margin: 0 auto; }
  .quiz-progress-bar {
    height: 5px;
    border-radius: 3px;
    background: var(--border-soft);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .25s ease;
  }
  .quiz-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--text-faint);
  }
  .quiz-meta-row .quiz-chapter-tag {
    color: var(--accent);
    font-weight: 700;
  }
  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);

const QUIZZES = [{"id": "q1", "section_no": 1, "section_title": "리눅스란 무엇인가?", "chapter_no": 2, "chapter_title": "운영 체제", "question": "다음 중 '커널 모드'에서 실행되는 작업은 무엇일까요?", "choices": ["디스크 드라이버가 디스크 컨트롤러에 직접 명령을 보낸다", "웹 브라우저가 화면에 페이지를 렌더링한다", "텍스트 에디터가 문서를 화면에 표시한다", "계산기 앱이 사용자 입력을 계산한다"], "correct_index": 0, "explanation": "디스크, 네트워크 카드 등 하드웨어를 직접 제어하는 코드(드라이버)만 커널 모드에서 실행됩니다. 나머지는 모두 사용자 프로그램이라 사용자 모드에서 실행되며, 하드웨어가 필요하면 시스템 콜로 커널에 요청합니다."}, {"id": "q2", "section_no": 1, "section_title": "리눅스란 무엇인가?", "chapter_no": 3, "chapter_title": "패키지 관리 시스템", "question": "apt install 실행 중 'Unable to locate package'가 뜰 때, 가장 먼저 시도할 명령은?", "choices": ["sudo apt update", "sudo reboot", "apt remove --all", "rm -rf /var/lib/apt"], "correct_index": 0, "explanation": "패키지 목록(캐시)이 오래되어 최신 패키지 정보를 못 찾는 경우가 흔합니다. sudo apt update로 리포지토리 정보를 최신화한 뒤 다시 설치를 시도하는 것이 첫 번째 점검 순서입니다."}, {"id": "q3", "section_no": 1, "section_title": "리눅스란 무엇인가?", "chapter_no": 7, "chapter_title": "리눅스 데스크탑 둘러보기", "question": "[섹션 1 복습] 커널과 배포판의 관계를 가장 올바르게 설명한 것은?", "choices": ["커널과 배포판은 완전히 같은 것을 가리키는 다른 이름이다", "배포판은 커널만 따로 떼어서 배포하는 방식이다", "배포판은 커널에 각종 소프트웨어·패키지 관리자 등을 묶어 배포하는 패키지다", "커널은 배포판이 설치된 후에만 존재하는 부속 프로그램이다"], "correct_index": 2, "explanation": "리눅스는 정확히는 '커널'을 가리키며, 우리가 흔히 쓰는 Ubuntu·Rocky Linux 같은 '배포판'은 이 커널에 패키지 관리자, 데스크탑 환경, 각종 소프트웨어를 묶어서 배포하는 것입니다. 커널은 자동차의 엔진, 배포판은 엔진을 포함한 완성차라는 비유를 다시 떠올려보세요."}, {"id": "q4", "section_no": 2, "section_title": "최소한의 커맨드라인 사용법", "chapter_no": 6, "chapter_title": "파일 내용 검색", "question": "다음 중 `grep -v \"error\" log.txt` 명령어의 결과로 옳은 것은?", "choices": ["log.txt에서 \"error\"가 포함된 줄만 출력된다", "log.txt에서 \"error\"가 포함되지 않은 줄만 출력된다", "log.txt의 전체 내용이 그대로 출력된다", "아무것도 출력되지 않고 빈 결과가 나온다"], "correct_index": 1, "explanation": "-v는 invert(반전) 옵션으로, 패턴과 '일치하지 않는' 줄만 골라 출력합니다. 직관과 반대라 헷갈리기 쉬운 옵션이니 '제외하고 싶을 때 쓰는 옵션'으로 기억해두세요."}, {"id": "q5", "section_no": 2, "section_title": "최소한의 커맨드라인 사용법", "chapter_no": 7, "chapter_title": "파일 검색", "question": "find와 locate의 차이에 대한 설명 중 옳은 것은?", "choices": ["locate는 실시간으로 파일 시스템을 뒤지기 때문에 항상 최신 결과를 보장한다", "find는 색인(DB)을 이용해 검색하므로 locate보다 항상 빠르다", "locate는 미리 만들어둔 색인에서 찾아 빠르지만, 방금 만든 파일은 검색되지 않을 수 있다", "find와 locate는 완전히 동일한 방식으로 동작하는 명령어다"], "correct_index": 2, "explanation": "find는 검색 시작 경로부터 실시간으로 파일 시스템을 탐색해 항상 최신 상태를 반영하지만 느릴 수 있습니다. 반면 locate는 미리 만들어둔 색인(DB)에서 찾기 때문에 매우 빠르지만, 색인이 주기적으로만 갱신되어 방금 생성한 파일은 안 나올 수 있습니다 (이 경우 sudo updatedb로 수동 갱신)."}, {"id": "q6", "section_no": 2, "section_title": "최소한의 커맨드라인 사용법", "chapter_no": 11, "chapter_title": "패키지 매니저 사용법(apt)", "question": "apt update와 apt upgrade의 차이를 올바르게 설명한 것은?", "choices": ["update는 패키지를 실제로 최신 버전으로 바꾸고, upgrade는 목록만 갱신한다", "update는 리포지토리의 최신 패키지 '목록'만 갱신하고, upgrade가 실제 설치된 패키지를 업그레이드한다", "update와 upgrade는 완전히 동일한 명령어다", "upgrade를 실행하면 자동으로 update도 함께 실행된다"], "correct_index": 1, "explanation": "apt update는 리포지토리 서버에서 최신 패키지 '목록'만 받아와 로컬 캐시를 갱신할 뿐, 실제 소프트웨어는 바뀌지 않습니다. 실제로 설치된 패키지를 최신 버전으로 바꾸는 건 apt upgrade이므로, 항상 update를 먼저 실행한 뒤 upgrade를 실행하는 순서가 올바릅니다."}, {"id": "q7", "section_no": 2, "section_title": "최소한의 커맨드라인 사용법", "chapter_no": 13, "chapter_title": "vi(vim) 편집기 사용법", "question": "vi 편집기에서 텍스트를 입력할 수 있는 모드로 전환하는 키는?", "choices": ["Esc", "i", ":", "q"], "correct_index": 1, "explanation": "vi는 명령 모드(기본 상태)에서 'i'를 눌러야 입력 모드로 전환되어 글자를 타이핑할 수 있습니다. Esc는 반대로 입력 모드에서 명령 모드로 되돌아가는 키이고, ':'는 명령행 모드로 진입해 :wq, :q! 같은 저장/종료 명령을 입력할 때 씁니다."}, {"id": "q8", "section_no": 3, "section_title": "파일", "chapter_no": 5, "chapter_title": "아이노드 그리고 하드링크와 소프트링크", "question": "원본 파일을 삭제해도 그 데이터가 여전히 살아있는 링크는?", "choices": ["하드링크", "소프트링크", "둘 다 살아있다", "둘 다 사라진다"], "correct_index": 0, "explanation": "하드링크는 원본과 동일한 아이노드를 공유하는 또 하나의 이름표이므로, 원본이라는 이름이 지워져도 하드링크 카운트가 0이 되지 않는 한 데이터는 그대로 남습니다. 반면 소프트링크는 경로만 저장하고 있어 원본이 사라지면 즉시 Broken Link가 됩니다."}, {"id": "q9", "section_no": 3, "section_title": "파일", "chapter_no": 8, "chapter_title": "[실습] 아이노드와 하드링크", "question": "ln으로 하드링크를 만들어 Links 개수가 2가 된 뒤, original.txt를 삭제하면?", "choices": ["0이 되어 데이터가 즉시 삭제된다", "1로 줄어들고 hardlink.txt로 데이터에 계속 접근 가능하다", "2로 변하지 않는다", "에러가 발생하여 삭제되지 않는다"], "correct_index": 1, "explanation": "하드링크 카운트는 해당 아이노드를 가리키는 이름표의 개수입니다. original.txt를 지우면 이름표 하나가 없어져 카운트가 2에서 1로 줄어들 뿐, hardlink.txt라는 이름표가 남아있는 한 데이터는 삭제되지 않습니다. 카운트가 0이 될 때만 실제로 디스크에서 삭제됩니다."}, {"id": "q10", "section_no": 3, "section_title": "파일", "chapter_no": 9, "chapter_title": "[실습] 소프트링크", "question": "소프트링크 target.txt를 삭제 후 cat mylink.txt가 에러(Broken Link)를 내는 근본 원인은?", "choices": ["mylink.txt 자신의 아이노드가 함께 삭제되었기 때문", "소프트링크는 원본의 '경로'만 저장하고 있어 그 경로가 더 이상 존재하지 않기 때문", "소프트링크와 target.txt가 같은 아이노드를 공유하기 때문", "mylink.txt의 파일 권한이 자동으로 변경되었기 때문"], "correct_index": 1, "explanation": "소프트링크는 하드링크와 달리 원본과 아이노드를 공유하지 않고, 자신만의 새 아이노드에 원본의 '경로 문자열'만 저장합니다. target.txt가 삭제되면 그 경로가 더 이상 유효하지 않으므로 링크 파일 자체는 남아있어도 대상을 찾지 못해 Broken Link가 됩니다."}, {"id": "q11", "section_no": 4, "section_title": "사용자와 그룹", "chapter_no": 3, "chapter_title": "파일 권한 표기법", "question": "chmod 750 file.sh 를 실행하면 그룹(Group) 사용자는 어떤 권한을 갖는가?", "choices": ["읽기 + 쓰기 + 실행 권한을 모두 갖는다", "읽기 + 실행 권한만 갖는다 (쓰기는 없음)", "읽기 권한만 갖는다", "아무 권한도 갖지 못한다"], "correct_index": 1, "explanation": "750을 자리별로 나누면 소유자=7(rwx), 그룹=5(r-x), 기타=0(---)입니다. r=4, x=1을 더한 5는 읽기와 실행만 가능하고 쓰기(2)는 포함되지 않습니다."}, {"id": "q12", "section_no": 4, "section_title": "사용자와 그룹", "chapter_no": 5, "chapter_title": "[실습] 사용자 추가 및 삭제", "question": "sudo userdel alice2 만 실행하고 sudo userdel -r alice2 는 실행하지 않았다. /home/alice2는 어떻게 되는가?", "choices": ["계정과 홈 디렉터리가 모두 즉시 삭제된다", "계정만 삭제되고, 홈 디렉터리(/home/alice2)는 그대로 남는다", "계정은 남고 홈 디렉터리만 삭제된다", "명령어가 실행되지 않고 에러가 발생한다"], "correct_index": 1, "explanation": "-r(remove) 옵션을 주지 않으면 userdel은 계정 정보만 삭제하고 홈 디렉터리는 그대로 남깁니다. 홈 디렉터리까지 완전히 삭제하려면 반드시 -r을 함께 써야 합니다."}, {"id": "q13", "section_no": 4, "section_title": "사용자와 그룹", "chapter_no": 8, "chapter_title": "[실습] 스크립트 실행", "question": "실행 권한(x)이 없는 상태에서 ./script.sh 로 스크립트를 실행하면 어떤 결과가 나오는가?", "choices": ["셔뱅에 지정된 쉘로 정상적으로 실행된다", "Permission denied 에러가 발생하며 실행되지 않는다", "자동으로 bash script.sh 방식으로 대신 실행된다", "권한과 무관하게 항상 정상 실행된다"], "correct_index": 1, "explanation": "./script.sh 처럼 파일을 직접 실행하려면 그 파일 자체에 실행(x) 권한이 있어야 합니다. x 권한이 없으면 커널이 실행을 거부하며 Permission denied가 발생하고, chmod +x로 권한을 부여해야 해결됩니다."}, {"id": "q14", "section_no": 5, "section_title": "프로세스와 시그널", "chapter_no": 3, "chapter_title": "프로세스 상태", "question": "부모보다 먼저 자식이 종료됐지만, 부모가 아직 그 종료 상태를 회수(wait)하지 않아 ps 목록에 Z 상태로 남아있는 프로세스를 무엇이라 부르나?", "choices": ["좀비(Zombie) 프로세스", "고아(Orphan) 프로세스", "데몬(Daemon) 프로세스", "포어그라운드 프로세스"], "correct_index": 0, "explanation": "좀비는 '자식이 죽었지만 부모가 상태를 회수하지 않은' 경우, 고아는 반대로 '부모가 먼저 죽어서 자식이 남겨진' 경우입니다. 고아 프로세스는 챕터 4에서 배우듯 PID 1(systemd/init)이 새 부모로 입양합니다."}, {"id": "q15", "section_no": 5, "section_title": "프로세스와 시그널", "chapter_no": 9, "chapter_title": "시그널", "question": "먹통이 된 프로세스에게 우선 시도해야 하며, 파일 저장 등 정상적인 정리 작업을 할 기회를 주는 시그널은?", "choices": ["SIGTERM", "SIGKILL", "SIGSTOP", "SIGCONT"], "correct_index": 0, "explanation": "SIGTERM(15)은 프로세스가 직접 처리(핸들링)할 수 있는 '정중한 종료 요청'이라 정리 작업 후 스스로 종료할 기회를 줍니다. SIGKILL(9)은 그 기회 없이 즉시 강제 종료되고, SIGSTOP/SIGCONT는 종료가 아니라 정지/재개를 담당합니다."}, {"id": "q16", "section_no": 5, "section_title": "프로세스와 시그널", "chapter_no": 11, "chapter_title": "[실습] 프로세스 종료 상태", "question": "어떤 명령어를 실행한 뒤 echo $? 를 쳤더니 137이 출력됐다. 이 프로세스에게 무슨 일이 있었을 가능성이 가장 높은가?", "choices": ["정상적으로 성공적으로 종료됐다 (exit 0)", "명령어를 찾을 수 없었다 (127)", "SIGKILL(9)에 의해 강제 종료됐다 (128+9=137)", "Ctrl+C(SIGINT)로 종료됐다 (130)"], "correct_index": 2, "explanation": "시그널로 종료된 프로세스의 종료 코드는 128+시그널번호 공식을 따릅니다. 137 = 128+9이므로 SIGKILL로 강제 종료된 경우입니다. 127은 명령어 없음, 130은 128+2(SIGINT)로 별개의 상황입니다."}, {"id": "q17", "section_no": 5, "section_title": "프로세스와 시그널", "chapter_no": 13, "chapter_title": "[실습] 포어그라운드 프로세스와 백그라운드 프로세스", "question": "nano로 파일을 편집하다가 Ctrl+Z를 눌러 정지시킨 뒤, 다시 편집 화면으로 복귀하려면 어떤 명령을 입력해야 하는가?", "choices": ["jobs %1", "bg %1", "fg %1", "kill %1"], "correct_index": 2, "explanation": "fg %1은 정지되어 있거나 백그라운드에서 돌던 1번 작업을 다시 포어그라운드로 가져와 터미널을 점유시킵니다. jobs는 목록 확인용, bg는 백그라운드로 이어서 실행, kill은 종료 명령이라 편집 내용을 잃게 됩니다."}, {"id": "q18", "section_no": // flatten for nav + search
const FLAT = [];
DATA.forEach(sec => {
  sec.chapters.forEach(ch => {
    FLAT.push({ sectionNo: sec.section_no, sectionTitle: sec.section_title, ...ch });
  });
});

let activeSectionFilter = null; // null = all
let searchQuery = '';
let selectedKey = null; // "s-c"

const el = id => document.getElementById(id);

/* ---------- stats strip ---------- */
function renderStats() {
  const totalCh = FLAT.length;
  const totalPractice = FLAT.filter(c => c.is_practice).length;
  el('statsStrip').innerHTML = `
    <div class="stat"><div class="num accent">${DATA.length}</div><div class="label">Sections</div></div>
    <div class="stat"><div class="num">${totalCh}</div><div class="label">Chapters</div></div>
    <div class="stat"><div class="num">${totalPractice}</div><div class="label">Hands-on Labs</div></div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>개념 학습</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--practice)"></span>실습 챕터</div>
    </div>
  `;
}

/* ---------- section filter chips ---------- */
function renderFilterChips() {
  const chips = ['<button class="chip ' + (activeSectionFilter===null?'active':'') + '" data-sec="all">전체</button>']
    .concat(DATA.map(sec => `<button class="chip ${activeSectionFilter===sec.section_no?'active':''}" data-sec="${sec.section_no}">S${sec.section_no} · ${sec.section_title}</button>`));
  el('sectionFilter').innerHTML = chips.join('');
  el('sectionFilter').querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.sec;
      activeSectionFilter = v === 'all' ? null : Number(v);
      renderAll();
    });
  });
}

function highlight(text) {
  if (!searchQuery) return escapeHtml(text);
  const q = searchQuery.toLowerCase();
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function matchesSearch(ch) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  if (ch.title.toLowerCase().includes(q)) return true;
  return ch.topics.some(t => t.toLowerCase().includes(q));
}

function visibleSections() {
  return DATA.filter(sec => activeSectionFilter === null || sec.section_no === activeSectionFilter)
    .map(sec => ({...sec, chapters: sec.chapters.filter(matchesSearch)}))
    .filter(sec => sec.chapters.length > 0 || !searchQuery);
}

/* ---------- TREE VIEW ---------- */
let openSections = new Set(DATA.map(s => s.section_no)); // default all open when filtered/search

function renderTree() {
  const sections = visibleSections();
  if (sections.length === 0) {
    el('treeView').innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }
  let html = `
    <div class="root-node">
      <span class="glyph">/</span>
      <span class="label"><b>리눅스 마스터 클래스</b> — 전체 커리큘럼 루트</span>
    </div>
    <div class="trunk">
  `;
  sections.forEach(sec => {
    const isOpen = searchQuery ? true : openSections.has(sec.section_no);
    html += `
      <div class="section-branch ${isOpen ? 'open' : ''}" data-sec="${sec.section_no}">
        <div class="section-head">
          <span class="idx">S${sec.section_no}</span>
          <h3>${highlight(sec.section_title)}</h3>
          <span class="meta">${sec.chapters.length}ch</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="chapter-list">
          ${sec.chapters.map(ch => chapterNodeHtml(sec.section_no, ch)).join('')}
        </div>
      </div>
    `;
  });
  html += '</div>';
  el('treeView').innerHTML = html;

  el('treeView').querySelectorAll('.section-head').forEach(head => {
    head.addEventListener('click', () => {
      const branch = head.parentElement;
      const secNo = Number(branch.dataset.sec);
      if (openSections.has(secNo)) openSections.delete(secNo); else openSections.add(secNo);
      branch.classList.toggle('open');
    });
  });
  bindChapterClicks('#treeView .chapter-node');
}

function chapterNodeHtml(secNo, ch) {
  const key = secNo + '-' + ch.no;
  const selected = selectedKey === key ? 'selected' : '';
  return `
    <div class="chapter-node ${selected}" data-key="${key}">
      <span class="cno">${String(ch.no).padStart(2,'0')}</span>
      <span class="ctitle">${highlight(ch.title)}</span>
      ${ch.is_practice ? '<span class="badge-practice">LAB</span>' : ''}
    </div>
  `;
}

/* ---------- LIST VIEW ---------- */
function renderList() {
  const sections = visibleSections();
  if (sections.length === 0) {
    el('listView').innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }
  el('listView').innerHTML = sections.map(sec => `
    <div class="list-section">
      <div class="list-section-head">
        <span class="idx">S${sec.section_no}</span>
        <h3>${highlight(sec.section_title)}</h3>
        <span class="count">${sec.chapters.length}개 챕터</span>
      </div>
      <div class="card-grid">
        ${sec.chapters.map(ch => cardHtml(sec.section_no, ch)).join('')}
      </div>
    </div>
  `).join('');
  bindChapterClicks('#listView .chapter-card');
}

function cardHtml(secNo, ch) {
  const key = secNo + '-' + ch.no;
  const selected = selectedKey === key ? 'selected' : '';
  return `
    <div class="chapter-card ${selected}" data-key="${key}">
      <div class="top-row">
        <span class="cno">CH.${String(ch.no).padStart(2,'0')}</span>
        ${ch.is_practice ? '<span class="badge-practice">LAB</span>' : ''}
      </div>
      <div class="ctitle">${highlight(ch.title)}</div>
    </div>
  `;
}

function bindChapterClicks(selector) {
  document.querySelectorAll(selector).forEach(node => {
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      openDetail(node.dataset.key);
    });
  });
}

/* ---------- DETAIL PANEL ---------- */
function findByKey(key) {
  const [secNo, chNo] = key.split('-').map(Number);
  return FLAT.find(c => c.sectionNo === secNo && c.no === chNo);
}

function openDetail(key) {
  selectedKey = key;
  const ch = findByKey(key);
  if (!ch) return;

  el('detailEyebrow').innerHTML = `SECTION ${ch.sectionNo} · CHAPTER ${String(ch.no).padStart(2,'0')}` +
    (ch.is_practice ? ' <span class="practice-tag">HANDS-ON LAB</span>' : '');
  el('detailTitle').textContent = ch.title;
  el('detailTopics').innerHTML = ch.topics.map(t => `
    <div class="topic-item"><span class="tick">›</span><span>${escapeHtml(t)}</span></div>
  `).join('') || '<div class="topic-item"><span></span><span style="color:var(--text-faint)">세부 항목 정보 없음</span></div>';

  const idx = FLAT.findIndex(c => c.sectionNo === ch.sectionNo && c.no === ch.no);
  const prev = FLAT[idx - 1];
  const next = FLAT[idx + 1];
  el('navPrev').disabled = !prev;
  el('navNext').disabled = !next;
  el('navPrevTitle').textContent = prev ? prev.title : '';
  el('navNextTitle').textContent = next ? next.title : '';
  el('navPrev').onclick = () => prev && openDetail(prev.sectionNo + '-' + prev.no);
  el('navNext').onclick = () => next && openDetail(next.sectionNo + '-' + next.no);

  el('overlay').classList.add('open');
  el('detailPanel').classList.add('open');

  // reflect selection in current view without full re-render (avoid losing scroll)
  document.querySelectorAll('.chapter-node, .chapter-card').forEach(n => {
    n.classList.toggle('selected', n.dataset.key === key);
  });
}

function closeDetail() {
  el('overlay').classList.remove('open');
  el('detailPanel').classList.remove('open');
}

el('detailClose').addEventListener('click', closeDetail);
el('overlay').addEventListener('click', closeDetail);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

/* ---------- view toggle ---------- */
function setView(view) {
  const isTree = view === 'tree';
  const isList = view === 'list';
  const isQuiz = view === 'quiz';
  el('treeView').classList.toggle('active', isTree);
  el('listView').classList.toggle('active', isList);
  el('quizView').classList.toggle('active', isQuiz);
  el('btnTree').classList.toggle('active', isTree);
  el('btnList').classList.toggle('active', isList);
  el('btnQuiz').classList.toggle('active', isQuiz);
  el('btnTree').setAttribute('aria-selected', isTree);
  el('btnList').setAttribute('aria-selected', isList);
  el('btnQuiz').setAttribute('aria-selected', isQuiz);
  el('sectionFilter').style.display = isQuiz ? 'none' : '';
  el('statsStrip').style.display = isQuiz ? 'none' : '';
  localStorage.setItem('roadmap-view', view);
  if (isQuiz) renderQuizIntro();
}
el('btnTree').addEventListener('click', () => setView('tree'));
el('btnList').addEventListener('click', () => setView('list'));
el('btnQuiz').addEventListener('click', () => setView('quiz'));

/* ---------- search ---------- */
let searchDebounce;
el('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderAll();
  }, 120);
});

/* ---------- quiz mode ---------- */
let quizScope = 'all'; // 'all' or section_no
let quizQueue = [];
let quizIndex = 0;
let quizAnswers = []; // { quizId, choiceIndex, correct }
let quizAnswered = false;

function quizPool(scope) {
  if (scope === 'all') return QUIZZES;
  return QUIZZES.filter(q => q.section_no === scope);
}

function quizBestKey(scope) {
  return 'roadmap-quiz-best-' + scope;
}

function renderQuizIntro() {
  const sectionsWithQuiz = [...new Set(QUIZZES.map(q => q.section_no))].sort((a, b) => a - b);
  const scopeChips = ['<button data-scope="all" class="' + (quizScope === 'all' ? 'active' : '') + '">전체 (' + QUIZZES.length + '문항)</button>']
    .concat(sectionsWithQuiz.map(sn => {
      const count = QUIZZES.filter(q => q.section_no === sn).length;
      const title = DATA.find(s => s.section_no === sn)?.section_title || ('섹션 ' + sn);
      return `<button data-scope="${sn}" class="${quizScope === sn ? 'active' : ''}">S${sn} · ${escapeHtml(title)} (${count})</button>`;
    }));

  const pool = quizPool(quizScope);
  const best = localStorage.getItem(quizBestKey(quizScope));
  const bestHtml = best ? `<div class="quiz-best">이 범위 최고 기록: <b style="color:var(--accent)">${best}</b> / ${pool.length}</div>` : '';

  el('quizView').innerHTML = `
    <div class="quiz-intro">
      <h2>미니 퀴즈로 이해도 점검하기</h2>
      <p>커리큘럼 전체에서 뽑은 실전 퀴즈로 각 챕터의 핵심 개념을 얼마나 기억하는지 점검해보세요.<br>범위를 고른 뒤 시작하면 그 범위의 문항이 무작위 순서로 출제됩니다.</p>
      <div class="quiz-scope">${scopeChips.join('')}</div>
      <button class="quiz-start-btn" id="quizStartBtn" ${pool.length === 0 ? 'disabled' : ''}>퀴즈 시작하기</button>
      <div class="quiz-count-hint">${pool.length}개 문항이 출제됩니다</div>
      ${bestHtml}
    </div>
  `;

  el('quizView').querySelectorAll('.quiz-scope button').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.scope;
      quizScope = v === 'all' ? 'all' : Number(v);
      renderQuizIntro();
    });
  });
  el('quizStartBtn')?.addEventListener('click', startQuiz);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  quizQueue = shuffle(quizPool(quizScope));
  quizIndex = 0;
  quizAnswers = [];
  renderQuizQuestion();
}

function renderQuizQuestion() {
  quizAnswered = false;
  const q = quizQueue[quizIndex];
  const total = quizQueue.length;
  const progressPct = Math.round((quizIndex / total) * 100);

  el('quizView').innerHTML = `
    <div class="quiz-runner">
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progressPct}%"></div></div>
      <div class="quiz-meta-row">
        <span>문제 ${quizIndex + 1} / ${total}</span>
        <span class="quiz-chapter-tag">S${q.section_no} · ${escapeHtml(q.chapter_title || '')}</span>
      </div>
      <div class="quiz-card">
        <p class="quiz-question">${escapeHtml(q.question)}</p>
        <div class="quiz-choices" id="quizChoices">
          ${q.choices.map((c, i) => `
            <button class="quiz-choice" data-idx="${i}">
              <span class="quiz-choice-label">${String.fromCharCode(65 + i)}</span>
              <span>${escapeHtml(c)}</span>
            </button>
          `).join('')}
        </div>
        <div class="quiz-explanation" id="quizExplanation" style="display:none"></div>
        <div class="quiz-actions">
          <button class="quiz-next-btn" id="quizNextBtn" disabled>${quizIndex + 1 === total ? '결과 보기' : '다음 문제'} →</button>
        </div>
      </div>
    </div>
  `;

  el('quizChoices').querySelectorAll('.quiz-choice').forEach(btn => {
    btn.addEventListener('click', () => selectQuizChoice(Number(btn.dataset.idx)));
  });
  el('quizNextBtn').addEventListener('click', advanceQuiz);
}

function selectQuizChoice(choiceIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQueue[quizIndex];
  const correct = choiceIdx === q.correct_index;
  quizAnswers.push({ quizId: q.id, choiceIndex: choiceIdx, correct });

  el('quizChoices').querySelectorAll('.quiz-choice').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct_index) btn.classList.add('correct');
    else if (i === choiceIdx) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const expl = el('quizExplanation');
  expl.style.display = 'block';
  expl.innerHTML = `<strong>${correct ? '정답입니다.' : '오답입니다.'}</strong> ${escapeHtml(q.explanation || '')}`;
  el('quizNextBtn').disabled = false;
}

function advanceQuiz() {
  quizIndex++;
  if (quizIndex >= quizQueue.length) {
    renderQuizResult();
  } else {
    renderQuizQuestion();
  }
}

function renderQuizResult() {
  const total = quizQueue.length;
  const correctCount = quizAnswers.filter(a => a.correct).length;
  const pct = Math.round((correctCount / total) * 100);

  const best = Number(localStorage.getItem(quizBestKey(quizScope)) || 0);
  if (correctCount > best) {
    localStorage.setItem(quizBestKey(quizScope), String(correctCount));
  }
  const isNewBest = correctCount > best;

  let gradeClass = 'retry', gradeLabel = '다시 도전해보세요';
  if (pct >= 90) { gradeClass = 'great'; gradeLabel = '완벽해요!'; }
  else if (pct >= 60) { gradeClass = 'good'; gradeLabel = '잘했어요'; }

  const reviewHtml = quizAnswers.map(a => {
    const q = quizQueue.find(x => x.id === a.quizId);
    return `
      <div class="quiz-review-item ${a.correct ? 'ok' : 'no'}">
        <span class="rq-icon">${a.correct ? '✔' : '✕'}</span>
        <span class="rq-text"><b>S${q.section_no}·${escapeHtml(q.chapter_title || '')}</b><br>${escapeHtml(q.question)}</span>
      </div>
    `;
  }).join('');

  el('quizView').innerHTML = `
    <div class="quiz-result">
      <div class="quiz-result-score">${correctCount}<span style="font-size:30px;color:var(--text-faint)"> / ${total}</span></div>
      <div class="quiz-result-label">정답률 ${pct}%${isNewBest ? ' · 새로운 최고 기록!' : ''}</div>
      <div class="quiz-result-grade ${gradeClass}">${gradeLabel}</div>
      <div class="quiz-review-list">${reviewHtml}</div>
      <div class="quiz-result-actions">
        <button class="quiz-retry-btn" id="quizRetryBtn">다시 풀기</button>
        <button class="quiz-back-btn" id="quizBackBtn">범위 다시 선택</button>
      </div>
    </div>
  `;
  el('quizRetryBtn').addEventListener('click', startQuiz);
  el('quizBackBtn').addEventListener('click', renderQuizIntro);
}

/* ---------- theme ---------- */
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
el('themeBtn').addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
});

/* ---------- render orchestration ---------- */
function renderAll() {
  renderStats();
  renderFilterChips();
  renderTree();
  renderList();
}

renderAll();
const savedView = localStorage.getItem('roadmap-view');
if (savedView === 'list' || savedView === 'quiz') setView(savedView);
</script>
